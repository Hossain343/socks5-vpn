[package]
name = "vpnclient"
version = "1.0.0"
edition = "2021"

[lib]
name = "vpnclient"
crate-type = ["cdylib", "staticlib"]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
tokio-util = "0.7"
netstack-smoltcp = "0.2"
futures = "0.3"
libc = "0.2"
log = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
android_logger = "0.13"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
